[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missions-harness"
version = "1.0.0"
description = "Serial multi-agent coding harness with a local-first control UI."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
missions = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.agents", "src.api", "src.api.routers", "src.sandbox", "src.tools", "src.workspace", "src.evals", "src.settings"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
